name: Build ESTUDIAX platform installers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Swift core
        run: swift test
      - name: Build release
        run: swift build -c release
      - name: Create DMG
        run: |
          mkdir -p package/ESTUDIAX.app/Contents/MacOS
          cp .build/release/ESTUDIAX package/ESTUDIAX.app/Contents/MacOS/ESTUDIAX
          cat > package/ESTUDIAX.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleExecutable</key><string>ESTUDIAX</string><key>CFBundleIdentifier</key><string>app.estudiax.mac</string><key>CFBundleName</key><string>ESTUDIAX</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleVersion</key><string>0.1.0</string><key>CFBundleShortVersionString</key><string>0.1.0</string></dict></plist>
          PLIST
          hdiutil create -volname ESTUDIAX -srcfolder package/ESTUDIAX.app -ov -format UDZO ESTUDIAX-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ESTUDIAX-macOS-DMG
          path: ESTUDIAX-macOS.dmg
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ESTUDIAX-macOS.dmg --clobber
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ESTUDIAX-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ESTUDIAX-Android-APK
          path: ESTUDIAX-Android-debug.apk
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ESTUDIAX-Android-debug.apk --clobber
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            asset: windows
          - os: ubuntu-22.04
            args: --bundles appimage,deb
            asset: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - run: npm install
        working-directory: desktop
      - name: Build desktop installer
        run: npx tauri build ${{ matrix.args }}
        working-directory: desktop
      - name: Normalize release filenames
        shell: bash
        run: |
          if [ "${{ matrix.asset }}" = "windows" ]; then
            f=$(find desktop/src-tauri/target/release/bundle/nsis -type f -name '*.exe' | head -1)
            cp "$f" ESTUDIAX-Windows-Setup.exe
          else
            f=$(find desktop/src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' | head -1)
            cp "$f" ESTUDIAX-Linux.AppImage
            f=$(find desktop/src-tauri/target/release/bundle/deb -type f -name '*.deb' | head -1)
            cp "$f" ESTUDIAX-Linux.deb
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ESTUDIAX-${{ matrix.asset }}-installer
          path: ESTUDIAX-*
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ASSET: ${{ matrix.asset }}
        shell: bash
        run: |
          if [ "$ASSET" = "windows" ]; then gh release upload "$TAG" ESTUDIAX-Windows-Setup.exe --clobber; fi
          if [ "$ASSET" = "linux" ]; then gh release upload "$TAG" ESTUDIAX-Linux.AppImage ESTUDIAX-Linux.deb --clobber; fi
