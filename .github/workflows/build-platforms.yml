name: Build ESTUDIAX platform installers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: estudiax-platform-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate app icons
        run: |
          python3 -m pip install --user pillow
          python3 scripts/generate-icons.py
          iconutil -c icns ESTUDIAX.iconset -o /tmp/ESTUDIAX.icns
      - name: Build and test Swift core
        run: swift test
      - name: Build release
        run: swift build -c release
      - name: Create DMG
        run: |
          mkdir -p package/ESTUDIAX.app/Contents/MacOS package/ESTUDIAX.app/Contents/Resources
          cp .build/release/ESTUDIAX package/ESTUDIAX.app/Contents/MacOS/ESTUDIAX
          cat > package/ESTUDIAX.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleExecutable</key><string>ESTUDIAX</string><key>CFBundleIconFile</key><string>ESTUDIAX.icns</string><key>LSMinimumSystemVersion</key><string>13.0</string><key>CFBundleIdentifier</key><string>app.estudiax.mac</string><key>CFBundleName</key><string>ESTUDIAX</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleVersion</key><string>0.1.0</string><key>CFBundleShortVersionString</key><string>0.1.0</string></dict></plist>
          PLIST
          cp /tmp/ESTUDIAX.icns package/ESTUDIAX.app/Contents/Resources/ESTUDIAX.icns
          printf 'APPL????' > package/ESTUDIAX.app/Contents/PkgInfo
          # Package the containing directory so the mounted volume contains
          # ESTUDIAX.app at its root (not just the app bundle's Contents folder).
          hdiutil create -volname ESTUDIAX -srcfolder package -ov -format UDZO ESTUDIAX-macOS.dmg
          hdiutil verify ESTUDIAX-macOS.dmg
          # Smoke-test the actual mounted image before publishing it.
          mkdir -p "$RUNNER_TEMP/estudiax-dmg-mount"
          hdiutil attach ESTUDIAX-macOS.dmg -readonly -nobrowse -mountpoint "$RUNNER_TEMP/estudiax-dmg-mount"
          test -d "$RUNNER_TEMP/estudiax-dmg-mount/ESTUDIAX.app/Contents/MacOS"
          test -x "$RUNNER_TEMP/estudiax-dmg-mount/ESTUDIAX.app/Contents/MacOS/ESTUDIAX"
          plutil -lint "$RUNNER_TEMP/estudiax-dmg-mount/ESTUDIAX.app/Contents/Info.plist"
          hdiutil detach "$RUNNER_TEMP/estudiax-dmg-mount"
      - uses: actions/upload-artifact@v4
        with:
          name: ESTUDIAX-macOS-DMG
          path: ESTUDIAX-macOS.dmg

  apple-simulators:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - run: python3 -m pip install --user pillow && python3 scripts/generate-icons.py
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
      - name: Build iPhone and iPad simulator app
        run: xcodebuild -project ESTUDIAXApple.xcodeproj -scheme ESTUDIAXiOS -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build Apple Watch simulator app
        run: xcodebuild -project ESTUDIAXApple.xcodeproj -scheme ESTUDIAXWatch -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests and lint
        run: gradle -p android testDebugUnitTest lintDebug
      - name: Build Android debug APK
        run: gradle -p android assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ESTUDIAX-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ESTUDIAX-Android-APK
          path: ESTUDIAX-Android-debug.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            asset: windows
          - os: ubuntu-22.04
            args: --bundles appimage,deb
            asset: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon generator dependency
        run: python -m pip install --upgrade pillow
      - name: Generate platform icons
        run: python3 scripts/generate-icons.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - run: npm install
        working-directory: desktop
      - name: Build desktop installer
        run: npx tauri build ${{ matrix.args }}
        working-directory: desktop
      - name: Normalize release filenames
        shell: bash
        run: |
          if [ "${{ matrix.asset }}" = "windows" ]; then
            f=$(find desktop/src-tauri/target/release/bundle/nsis -type f -name '*.exe' | head -1)
            test -n "$f"
            cp "$f" ESTUDIAX-Windows-Setup.exe
          else
            f=$(find desktop/src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' | head -1)
            test -n "$f"
            cp "$f" ESTUDIAX-Linux.AppImage
            f=$(find desktop/src-tauri/target/release/bundle/deb -type f -name '*.deb' | head -1)
            test -n "$f"
            cp "$f" ESTUDIAX-Linux.deb
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ESTUDIAX-${{ matrix.asset }}-installer
          path: ESTUDIAX-*

  publish-continuous:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.android.result == 'success' && needs.desktop.result == 'success'
    needs: [android, desktop]
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ESTUDIAX-Android-APK
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: ESTUDIAX-windows-installer
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: ESTUDIAX-linux-installer
          path: dist
          merge-multiple: true
      - name: Verify expected release artifacts
        run: |
          set -euo pipefail
          test -s dist/ESTUDIAX-Android-debug.apk
          test -s dist/ESTUDIAX-Windows-Setup.exe
          test -s dist/ESTUDIAX-Linux.AppImage
          test -s dist/ESTUDIAX-Linux.deb
      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ESTUDIAX-Android-debug.apk ESTUDIAX-Windows-Setup.exe ESTUDIAX-Linux.AppImage ESTUDIAX-Linux.deb > SHA256SUMS.txt
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2
      - name: Sign Android, Windows, and Linux assets with keyless Sigstore
        run: |
          set -euo pipefail
          for file in dist/ESTUDIAX-Android-debug.apk dist/ESTUDIAX-Windows-Setup.exe dist/ESTUDIAX-Linux.AppImage dist/ESTUDIAX-Linux.deb; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
            test -s "${file}.sigstore.json"
          done
          cosign sign-blob --yes --bundle dist/SHA256SUMS.txt.sigstore.json dist/SHA256SUMS.txt
          test -s dist/SHA256SUMS.txt.sigstore.json
      - name: Create rolling non-Apple prerelease after Android, Windows, and Linux builds pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view continuous --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create continuous --repo "${{ github.repository }}" --target main --prerelease --title "ESTUDIAX continuous builds" --notes "Automated Android, Windows, and Linux test builds from the latest successful main-branch workflow. These are test packages, not store-ready stable releases. Apple packages are handled separately."
          gh release upload continuous dist/* --repo "${{ github.repository }}" --clobber

  publish-release:
    if: github.event_name == 'release' && needs.android.result == 'success' && needs.desktop.result == 'success'
    needs: [android, desktop]
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ESTUDIAX-Android-APK
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: ESTUDIAX-windows-installer
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: ESTUDIAX-linux-installer
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2
      - name: Sign Android, Windows, and Linux assets with keyless Sigstore
        run: |
          set -euo pipefail
          for file in dist/ESTUDIAX-Android-debug.apk dist/ESTUDIAX-Windows-Setup.exe dist/ESTUDIAX-Linux.AppImage dist/ESTUDIAX-Linux.deb; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
      - name: Publish non-Apple assets after Android, Windows, and Linux builds pass
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber

  publish-apple-preview:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.macos.result == 'success'
    needs: [macos]
    permissions:
      contents: write
      id-token: write
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ESTUDIAX-macOS-DMG
          path: dist
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2
      - name: Generate checksum and free keyless provenance signature
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 ESTUDIAX-macOS.dmg > ESTUDIAX-macOS.dmg.sha256
          cosign sign-blob --yes --bundle ESTUDIAX-macOS.dmg.sigstore.json ESTUDIAX-macOS.dmg
      - name: Publish Apple preview with explicit unsigned status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view continuous --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create continuous --repo "${{ github.repository }}" --target main --prerelease --title "ESTUDIAX continuous builds" --notes "Automated preview builds. Apple DMG has a free Sigstore provenance bundle but is not Apple Developer ID signed or notarized."
          gh release upload continuous dist/ESTUDIAX-macOS.dmg dist/ESTUDIAX-macOS.dmg.sha256 dist/ESTUDIAX-macOS.dmg.sigstore.json --repo "${{ github.repository }}" --clobber
