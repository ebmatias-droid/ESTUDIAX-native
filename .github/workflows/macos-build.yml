name: macOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
      - name: Package app executable for testing
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .build-artifacts
          swift build -c release
          tar -czf .build-artifacts/ESTUDIAX-macos-source-build.tar.gz -C .build/release ESTUDIAX
      - name: Upload test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ESTUDIAX-macos-test-build
          path: .build-artifacts/*
