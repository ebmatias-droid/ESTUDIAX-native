name: Free verifiable signatures (Sigstore)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to sign (for example continuous)
        required: true
        default: continuous
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  sign-release-assets:
    name: Sign non-Apple release assets with keyless Sigstore
    runs-on: ubuntu-latest
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2
      - name: Download existing non-Apple release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "ESTUDIAX-Android-debug.apk" --dir dist
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "ESTUDIAX-Windows-Setup.exe" --dir dist
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "ESTUDIAX-Linux.AppImage" --dir dist
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "ESTUDIAX-Linux.deb" --dir dist
      - name: Generate SHA-256 manifest and keyless Sigstore bundles
        run: |
          set -euo pipefail
          cd dist
          sha256sum ESTUDIAX-Android-debug.apk ESTUDIAX-Windows-Setup.exe ESTUDIAX-Linux.AppImage ESTUDIAX-Linux.deb > SHA256SUMS.txt
          for file in ESTUDIAX-Android-debug.apk ESTUDIAX-Windows-Setup.exe ESTUDIAX-Linux.AppImage ESTUDIAX-Linux.deb; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
            test -s "${file}.sigstore.json"
          done
          cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt
          test -s SHA256SUMS.txt.sigstore.json
      - name: Upload checksums and signature bundles to the same release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" dist/SHA256SUMS.txt dist/*.sigstore.json --repo "${{ github.repository }}" --clobber
