name: ESTUDIAXApple
options:
  bundleIdPrefix: app.estudiax
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  ESTUDIAXiOS:
    type: application
    platform: iOS
    sources:
      - path: AppleApps/ESTUDIAXiOS
      - path: Sources/ESTUDIAXCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.estudiax.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  ESTUDIAXWatch:
    type: application
    platform: watchOS
    sources:
      - path: AppleApps/ESTUDIAXWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.estudiax.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
schemes:
  ESTUDIAXiOS:
    build:
      targets:
        ESTUDIAXiOS: all
  ESTUDIAXWatch:
    build:
      targets:
        ESTUDIAXWatch: all
